# Run the AURUM XAU backend:   docker compose up -d --build
# With a free HTTPS address for your phone (Cloudflare quick tunnel):
#                               docker compose --profile tunnel up -d --build
#                               docker compose logs tunnel | grep trycloudflare.com
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      AURUM_DATA_DIR: /data
      AURUM_PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - aurum-data:/data

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://backend:8080
    depends_on:
      - backend

volumes:
  aurum-data:
